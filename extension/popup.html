<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leaf Reader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <span class="leaf">◆</span>
      <div><h1>Leaf Reader</h1><p>Private neural speech</p></div>
    </header>

    <label for="voice">Voice</label>
    <select id="voice"><option>Loading local voices…</option></select>

    <div class="speed-row">
      <label for="speed">Speed</label>
      <output id="speed-value">1.0×</output>
    </div>
    <input id="speed" type="range" min="0.65" max="1.55" value="1" step="0.05">

    <button id="read" class="primary">Read selection or page</button>
    <button id="stop" class="secondary">Stop</button>
    <p id="status" role="status">Ready</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
